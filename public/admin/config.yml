# ตั้งค่าหน้าเขียนบันทึก (Sveltia CMS) — https://github.com/sveltia/sveltia-cms
backend:
  name: github
  repo: saharatyokthuan/Diary
  branch: main

# รูปที่อัปโหลดเก็บใน repo; แต่ละ collection อ้างรูปแบบ relative (ดูด้านล่าง) ให้ Astro ย่อรูปได้
media_folder: src/assets/notes
public_folder: /src/assets/notes

media_libraries:
  default:
    config:
      # ชื่อไฟล์รูปจาก Samsung มักมีเว้นวรรค ("... Samsung Notes.jpg") ซึ่งทำให้ลิงก์รูปใน markdown พัง จึงแปลงเป็น "-" ให้
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 2000
          height: 2000

site_url: https://saharatyokthuan.github.io/Diary/
display_url: https://saharatyokthuan.github.io/Diary/

collections:
  - name: notes
    label: บันทึก
    label_singular: บันทึก
    folder: src/content/notes
    media_folder: /src/assets/notes
    public_folder: ../../assets/notes
    create: true
    slug: '{{year}}-{{month}}-{{day}}-{{uuid_short}}'
    summary: '{{title}} — {{date}}'
    sortable_fields: [date, title]
    preview_path: 'notes/{{slug}}/'
    fields:
      - { name: title, label: ชื่อเรื่อง, widget: string }
      # input_timezone: บันทึกวันที่พร้อม +07:00 (เวลาไทย) ไม่ใช่ตัวเลขเปล่า ๆ ที่เว็บจะอ่านเป็น UTC แล้ววันเลื่อนหลัง 17:00
      # default '{{now}}': ใส่วัน-เวลาปัจจุบันให้เองตอนสร้างบันทึกใหม่
      - name: date
        label: วันที่
        widget: datetime
        input_timezone: Asia/Bangkok
        default: '{{now}}'
      - name: categories
        label: หมวดหมู่
        label_singular: หมวดหมู่
        widget: list
        # รายการแบบง่าย: 1 ช่อง = 1 หมวด, กด Enter ในช่อง หรือปุ่ม "Add หมวดหมู่" เพื่อเพิ่มช่องใหม่ (ไม่แยกด้วยเครื่องหมายจุลภาค)
        hint: 'ช่องละ 1 หมวด — พิมพ์ชื่อหมวดแล้วกดปุ่ม Add หมวดหมู่ เพื่อเพิ่มช่องสำหรับหมวดถัดไป (อย่าพิมพ์หลายหมวดรวมในช่องเดียว) · ใช้ชื่อหมวดเดิมให้สะกดเหมือนเดิม ถ้าสะกดต่างไปจะกลายเป็นหมวดใหม่'
        min: 1
      - { name: cover, label: รูปปก, widget: image, required: false }
      - { name: draft, label: ฉบับร่าง (ยังไม่แสดงบนเว็บ), widget: boolean, default: false }
      - { name: body, label: เนื้อหา, widget: markdown }

  - name: pages
    label: หน้าเว็บ
    media_folder: /src/assets/notes
    public_folder: ../../assets/notes
    files:
      - name: about
        label: เกี่ยวกับฉัน
        file: src/content/pages/about.md
        fields:
          - { name: title, label: หัวข้อ, widget: string }
          - { name: body, label: เนื้อหา, widget: markdown }
